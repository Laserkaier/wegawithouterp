- type: markingsGroup
  parent: None
  id: Shadowkin
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Special:
      limit: 1
      required: false 
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ TailShadowkin ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ EarsShadowkin ]


- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceShadowkin
  name: shadowkin appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganShadowkinTorso
      Head: OrganShadowkinHead
      ArmLeft: OrganShadowkinArmLeft
      ArmRight: OrganShadowkinArmRight
      HandLeft: OrganShadowkinHandLeft
      HandRight: OrganShadowkinHandRight
      LegLeft: OrganShadowkinLegLeft
      LegRight: OrganShadowkinLegRight
      FootLeft: OrganShadowkinFootLeft
      FootRight: OrganShadowkinFootRight
      Brain: OrganShadowkinBrain
      Eyes: OrganShadowkinEyes
      Tongue: OrganShadowkinTongue
      Appendix: OrganShadowkinAppendix
      Ears: OrganShadowkinEars
      Lungs: OrganShadowkinLungs
      Heart: OrganShadowkinHeart
      Stomach: OrganShadowkinStomach
      Liver: OrganShadowkinLiver
      Kidneys: OrganShadowkinKidneys
  - type: HumanoidProfile
    species: Shadowkin

- type: entity
  parent:
  - AppearanceShadowkin
  - BaseSpeciesMobOrganic
  - BaseOperated
  id: MobShadowkin
  name: Urist McShadowkin
  components:
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTypeTrigger
            damageType: Blunt
            damage: 300
          behaviors:
            - !type:GibBehavior {}
            - !type:SpawnEntitiesBehavior
              spawn:
                ShadowkinShadow:
                  min: 1
                  max: 1
                EffectFlashShadowkinShadeskip:
                  min: 1
                  max: 1
        - trigger:
            !type:DamageTypeTrigger
            damageType: Heat
            damage: 1500
          behaviors:
            - !type:SpawnEntitiesBehavior
              spawnInContainer: true
              spawn:
                Ash:
                  min: 1
                  max: 1
            - !type:BurnBodyBehavior {}
            - !type:PlaySoundBehavior
              sound:
                collection: MeatLaserImpact
    - type: PassiveDamage # Slight passive regen. Assuming one damage type, comes out to about 4 damage a minute.
      allowedStates:
        - Alive
      damageCap: 20
      damage:
        types:
          Heat: -0.07
        groups:
          Brute: -0.07
    - type: Blindable
    - type: ThermalRegulator
      metabolismHeat: 800
      radiatedHeat: 100
      implicitHeatRegulation: 500
      sweatHeatRegulation: 2000
      shiveringHeatRegulation: 2000
      normalBodyTemperature: 310.15
      thermalRegulationTemperatureThreshold: 25
    - type: Perishable
    - type: FireVisuals
      alternateState: Standing
    - type: Hunger
    - type: Thirst
    - type: Carriable
    - type: Icon
      sprite: _EinsteinEngines/Mobs/Species/Shadowkin/parts.rsi
      state: full
    - type: Body
      prototype: Shadowkin
    - type: Flammable
      damage:
        types:
          Heat: 1.5 # burn more
    - type: MobThresholds
      thresholds: # Weak
        0: Alive
        80: Critical
        180: Dead
    - type: SlowOnDamage
      speedModifierThresholds:
        48: 0.85
        64: 0.65
    - type: Damageable
      damageContainer: Biological # Shadowkin
      damageModifierSet: Shadowkin
    - type: Barotrauma
      damage:
        types:
          Blunt: 0.35 # per second, scales with pressure and other constants.
    - type: Bloodstream
      bloodlossDamage:
        types:
          Bloodloss: 1
      bloodlossHealDamage:
        types:
          Bloodloss: -0.25
      bloodReagent: BlackBlood
    - type: Temperature
      heatDamageThreshold: 330
      coldDamageThreshold: 195
      currentTemperature: 310.15
      specificHeat: 46
      coldDamage:
        types:
          Cold: 0.05 #per second, scales with temperature & other constants
      heatDamage:
        types:
          Heat: 0.25 #per second, scales with temperature & other constants
    - type: MeleeWeapon
      soundHit:
        collection: AlienClaw
      angle: 30
      animation: WeaponArcClaw
      damage:
        types:
          Slash: 5
    - type: Vocal
      sounds:
        Male: MaleShadowkin
        Female: FemaleShadowkin
        Unsexed: MaleShadowkin
    - type: TypingIndicator
      proto: alien
    - type: MovementSpeedModifier
      baseWalkSpeed: 2.7
      baseSprintSpeed: 4.5
    - type: Speech
      allowedEmotes: ['Mars', 'Wurble']
    - type: MindLink
      channels: ["Empathy"]
    - type: Tag
      tags:
      - CanPilot
      - FootstepSound
      - DoorBumpOpener
      - AnomalyHost

